
name: Marley Performance CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  performance:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start API
        run: docker compose up -d --build app

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1

      - name: Run performance smoke test
        run: docker compose run --rm k6 run /scripts/ci.js

      - name: Print API logs
        if: always()
        run: docker compose logs --no-color app

      - name: Stop environment
        if: always()
        run: docker compose down
